name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $npmVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($version -ne $npmVersion -or $version -ne $tauriVersion -or $version -ne $cargoVersion) {
            throw "Release tag $env:RELEASE_TAG must match package.json, tauri.conf.json and Cargo.toml versions."
          }
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo test -p pak-core
      - run: cargo clippy -p pak-core -p pak-cli -- -D warnings
      - run: npm test
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-standalone
          path: target/release/simutrans-factory-graph.exe
          if-no-files-found: error
  draft-release:
    name: Attach executable to draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: draft-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-standalone
          path: release-assets
      - name: Create or update draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset='release-assets/simutrans-factory-graph.exe'
          test -s "$asset"
          version_name="${RELEASE_TAG//./_}"
          named_asset="release-assets/simutrans-factory-graph-${version_name}.exe"
          mv "$asset" "$named_asset"
          asset="$named_asset"
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != 'true' ]; then
              echo "::error::Release $RELEASE_TAG is already published; assets will not be changed."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset" \
              --verify-tag --draft \
              --title "Simutrans Factory Graph $RELEASE_TAG" \
              --notes-file "$notes"
          fi
