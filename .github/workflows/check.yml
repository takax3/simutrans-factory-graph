name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo test -p pak-core
      - run: cargo clippy -p pak-core -p pak-cli -- -D warnings
      - run: npm test
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-standalone
          path: target/release/simutrans-factory-graph.exe
          if-no-files-found: error
